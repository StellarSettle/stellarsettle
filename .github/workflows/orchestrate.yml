name: Monorepo CI Orchestration

# Root-level workflow that orchestrates all package checks (#112)
# Provides a single pass/fail status for the entire monorepo

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build and test all packages
  contracts:
    name: Contracts (Soroban)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-contracts-${{ hashFiles('contracts/**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-contracts-

      - name: Build contracts
        run: cd contracts && cargo build --all

      - name: Test contracts
        run: cd contracts && cargo test --all

  backend:
    name: Backend (Node.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: cd backend && npm ci

      - name: Lint
        run: cd backend && npm run lint --if-present

      - name: Test
        run: cd backend && npm test --if-present

      - name: Build
        run: cd backend && npm run build --if-present

  frontend:
    name: Frontend (React/Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Lint
        run: cd frontend && npm run lint --if-present

      - name: Type check
        run: cd frontend && npm run type-check --if-present

      - name: Test
        run: cd frontend && npm test --if-present

      - name: Build
        run: cd frontend && npm run build --if-present

  # Aggregate status check (#112)
  status:
    name: Monorepo Status
    runs-on: ubuntu-latest
    needs: [contracts, backend, frontend]
    if: always()
    steps:
      - name: Check status
        run: |
          if [[ "${{ needs.contracts.result }}" != "success" ]]; then
            echo "❌ Contracts build/test failed"
            exit 1
          fi
          if [[ "${{ needs.backend.result }}" != "success" ]]; then
            echo "❌ Backend build/test failed"
            exit 1
          fi
          if [[ "${{ needs.frontend.result }}" != "success" ]]; then
            echo "❌ Frontend build/test failed"
            exit 1
          fi
          echo "✅ All packages passed"
